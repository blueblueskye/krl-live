<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRL Live</title>
<meta name="description" content="Live map of KRL Commuter Line Jabodetabek trains, animated from today's timetable.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='9' width='24' height='14' rx='7' fill='%23E30A16'/%3E%3Ccircle cx='22' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f6f6f3; --panel: rgba(255,255,255,.94); --ink: #15171c; --muted: #6b707a;
    --line: rgba(0,0,0,.09); --accent: #E30A16; --shadow: 0 6px 24px rgba(0,0,0,.12);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: rgba(22,24,30,.94); --ink: #eceef2; --muted: #9096a3; --line: rgba(255,255,255,.1); --shadow: 0 6px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #map { position: fixed; inset: 0; background: var(--bg); }
  #trains { position: absolute; inset: 0; pointer-events: none; z-index: 450; }

  .panel { position: fixed; z-index: 1000; background: var(--panel); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

  #hud { top: max(12px, env(safe-area-inset-top)); right: 12px; width: 232px; padding: 12px 14px; }
  #hud h1 { margin: 0; font-size: 15px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
  #hud h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #2bb24c; box-shadow: 0 0 0 0 #2bb24c88; animation: pulse 2s infinite; }
  #hud h1 .dot.sim { background: #f0a020; box-shadow: none; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px #2bb24c00; } 100% { box-shadow: 0 0 0 0 #2bb24c00; } }
  #clock { font: 600 26px/1.1 var(--mono); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  #clock small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
  #count { color: var(--muted); font-size: 12.5px; }
  .speed { display: flex; gap: 4px; margin: 10px 0 8px; }
  .speed button { flex: 1; padding: 5px 0; border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 8px; font: 600 12px var(--mono); cursor: pointer; }
  .speed button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #legend { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  #legend label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; padding: 2px 0; user-select: none; }
  #legend input { display: none; }
  #legend .sw { width: 18px; height: 6px; border-radius: 3px; }
  #legend input:not(:checked) + .sw { opacity: .2; }
  #legend input:not(:checked) ~ span:last-child { color: var(--muted); text-decoration: line-through; }
  #legend .n { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  #hud .fold { position: absolute; top: 10px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 4px; }
  #hud.min .speed, #hud.min #legend { display: none; }
  #hud.min #count { font-size: 11.5px; }

  #card { left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); max-width: 380px; padding: 14px 16px 10px;
    max-height: 46vh; overflow: auto; display: none; }
  #card.show { display: block; }
  #card .x { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; }
  #card .tag { display: inline-block; font: 600 11px var(--mono); padding: 2px 7px; border-radius: 6px; color: #fff; margin-bottom: 6px; }
  #card h2 { margin: 0 24px 2px 0; font-size: 17px; }
  #card .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  #card ol { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  #card li { position: relative; display: flex; justify-content: space-between; gap: 10px; padding: 3px 0 3px 8px; font-size: 13.5px; }
  #card li::before { content: ""; position: absolute; left: -20px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted); }
  #card li.past { color: var(--muted); }
  #card li.past::before { background: var(--muted); }
  #card li.next { font-weight: 650; }
  #card li.next::before { border-color: var(--c, var(--accent)); background: var(--c, var(--accent)); }
  #card li time { font: 13px var(--mono); font-variant-numeric: tabular-nums; }
  #card table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  #card td { padding: 5px 0; border-top: 1px solid var(--line); cursor: pointer; }
  #card td:first-child { font: 13px var(--mono); width: 54px; }
  #card td:last-child { text-align: right; color: var(--muted); font: 12px var(--mono); }
  #card .bar { display: inline-block; width: 4px; height: 12px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }

  #toast { left: 50%; transform: translateX(-50%); bottom: max(72px, calc(env(safe-area-inset-bottom) + 60px)); padding: 10px 14px; display: none; max-width: min(90vw, 420px); font-size: 13px; }
  #toast.show { display: block; }
  #toast button { margin-left: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; }

  .leaflet-container { font: inherit; background: var(--bg); }
  /* OSM tiles, muted so the lines stand out; inverted for dark mode */
  .leaflet-tile-pane { filter: saturate(.35) contrast(.92) brightness(1.04); }
  @media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(.3) brightness(.85) contrast(.9); } }
  .st-label { background: none; border: 0; box-shadow: none; padding: 0 0 0 2px; color: var(--ink); font-size: 11px; font-weight: 600;
    text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 2px var(--bg); }
  .st-label::before { display: none; }
  .zfar .st-label { display: none; }
  .leaflet-control-attribution { font-size: 10px; }

  @media (max-width: 560px) {
    #hud { width: 196px; padding: 10px 12px; }
    #clock { font-size: 22px; }
    #card { max-width: none; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="hud" class="panel">
  <button class="fold" title="Minimise" aria-label="Minimise panel">–</button>
  <h1><span class="dot" id="live"></span>KRL Live</h1>
  <div class="body">
    <div id="clock">--:--:--<small>WIB</small></div>
    <div id="count">Loading timetable…</div>
    <div class="speed" role="group" aria-label="Playback speed">
      <button data-s="1" class="on">1×</button><button data-s="10">10×</button><button data-s="60">60×</button><button data-s="now" title="Back to now">Now</button>
    </div>
    <div id="legend"></div>
  </div>
</div>

<div id="card" class="panel" role="dialog" aria-live="polite"></div>
<div id="toast" class="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
